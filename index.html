<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>ChromaKey</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overscroll-behavior: none; }
  #stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
  canvas { max-width: 100%; max-height: 100%; touch-action: none; image-rendering: crisp-edges; }
  #hint { position: absolute; top: 8px; left: 8px; right: 8px; text-align: center; font-size: 13px;
          background: #000a; padding: 6px; border-radius: 8px; pointer-events: none; }
  #panel { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #1c1c1c; display: grid; gap: 8px; overflow-y: auto; max-height: 35vh; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row label { font-size: 12px; min-width: 70px; }
  .row input[type=range] { flex: 1; min-width: 100px; }
  button, .btn { background: #333; color: #fff; border: 0; border-radius: 10px; padding: 10px 12px; font-size: 14px; flex-shrink: 0; }
  button.primary { background: #2b7cff; }
  button.rec { background: #d32f2f; }
  #swatch { width: 36px; height: 36px; border-radius: 8px; border: 2px solid #fff; background: #00ff00; flex-shrink: 0; }
  #install { display: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="out"></canvas>
  <div id="hint">Touchez l'image pour choisir la couleur à remplacer</div>
</div>
<div id="panel">
  <div class="row">
    <div id="swatch" title="Couleur ciblée"></div>
    <input type="color" id="color" value="#00ff00">
    <label class="btn" for="bgFile">🖼 Fond</label>
    <input type="file" id="bgFile" accept="image/*">
    <label class="btn" for="mediaFile">📂 Photo/Vidéo</label>
    <input type="file" id="mediaFile" accept="image/*,video/*">
    <button id="cam">📷 Caméra</button>
    <button id="flip">🔄</button>
    <button id="install">⬇ Installer</button>
  </div>
  <div class="row"><label>Tolérance</label><input type="range" id="tol" min="0" max="255" value="70"></div>
  <div class="row"><label>Adoucissement</label><input type="range" id="soft" min="0" max="100" value="30"></div>
  <div class="row">
    <button class="primary" id="snap">📸 Photo</button>
    <button id="rec">⏺ Vidéo</button>
  </div>
</div>
<video id="vid" playsinline muted autoplay hidden></video>
<script>
const $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d', { willReadFrequently: true });
const vid = $('vid');
const bgCanvas = document.createElement('canvas'), bgCtx = bgCanvas.getContext('2d');
let source = null;            // video element or Image
let key = [0, 255, 0];
let bgImg = null, bgReady = false;
let stream = null, facing = 'environment';
let recorder = null, chunks = [];

function setKey(r, g, b) {
  key = [r, g, b];
  const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  $('swatch').style.background = hex;
  $('color').value = hex;
}
$('color').oninput = e => {
  const v = parseInt(e.target.value.slice(1), 16);
  setKey(v >> 16, (v >> 8) & 255, v & 255);
};

function srcSize() {
  if (!source) return [0, 0];
  return source === vid ? [vid.videoWidth, vid.videoHeight] : [source.naturalWidth, source.naturalHeight];
}

function prepareBg(w, h) {
  bgCanvas.width = w; bgCanvas.height = h;
  if (!bgImg) { bgReady = false; return; }
  // "cover" fit
  const s = Math.max(w / bgImg.naturalWidth, h / bgImg.naturalHeight);
  const dw = bgImg.naturalWidth * s, dh = bgImg.naturalHeight * s;
  bgCtx.drawImage(bgImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
  bgReady = true;
}

$('bgFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { bgImg = img; prepareBg(out.width, out.height); };
  img.src = URL.createObjectURL(f);
};

async function startCam() {
  stopCam();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 480 }, height: { ideal: 360 } }, audio: false });
  } catch (err) { alert('Caméra indisponible : ' + err.message); return; }
  vid.srcObject = stream;
  vid.removeAttribute('src');
  await vid.play();
  source = vid;
  if (!frameReq) render();
}
function stopCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  vid.srcObject = null;
}
$('cam').onclick = startCam;
$('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCam(); };

$('mediaFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  stopCam();
  const url = URL.createObjectURL(f);
  if (f.type.startsWith('video/')) {
    vid.src = url; vid.loop = true; vid.muted = true;
    await vid.play();
    source = vid;
    if (!frameReq) render();
  } else {
    const img = new Image();
    img.onload = () => { source = img; if (!frameReq) render(); };
    img.src = url;
  }
};

// Tap to pick color
function pick(ev) {
  if (!source) return;
  const rect = out.getBoundingClientRect();
  const x = Math.floor((ev.clientX - rect.left) / rect.width * out.width);
  const y = Math.floor((ev.clientY - rect.top) / rect.height * out.height);
  // read from the raw source (not the keyed output)
  const tmp = document.createElement('canvas'); tmp.width = out.width; tmp.height = out.height;
  const t = tmp.getContext('2d'); t.drawImage(source, 0, 0, out.width, out.height);
  const r = 2, x0 = Math.max(0, x - r), y0 = Math.max(0, y - r);
  const d = t.getImageData(x0, y0, 2 * r + 1, 2 * r + 1).data;
  let R = 0, G = 0, B = 0, n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; }
  setKey(Math.round(R / n), Math.round(G / n), Math.round(B / n));
  $('hint').style.display = 'none';
}
out.addEventListener('pointerdown', pick);

let frameReq = null, lastW = 0, lastH = 0;
function render() {
  const [w, h] = srcSize();
  if (w && h) {
    if (out.width !== w || out.height !== h) { out.width = w; out.height = h; prepareBg(w, h); }
    ctx.drawImage(source, 0, 0, w, h);
    const frame = ctx.getImageData(0, 0, w, h), d = frame.data;
    const bg = bgReady ? bgCtx.getImageData(0, 0, w, h).data : null;
    const tol = +$('tol').value, soft = +$('soft').value / 100 * tol;
    const [kr, kg, kb] = key;
    for (let i = 0; i < d.length; i += 4) {
      const dr = d[i] - kr, dg = d[i + 1] - kg, db = d[i + 2] - kb;
      const dist = Math.sqrt(dr * dr + dg * dg + db * db) * 0.577;
      if (dist < tol) {
        let a = soft > 0 ? Math.max(0, (dist - (tol - soft)) / soft) : 0;
        const br = bg ? bg[i] : 0, bgG = bg ? bg[i + 1] : 0, bb = bg ? bg[i + 2] : 0;
        d[i] = d[i] * a + br * (1 - a);
        d[i + 1] = d[i + 1] * a + bgG * (1 - a);
        d[i + 2] = d[i + 2] * a + bb * (1 - a);
      }
    }
    ctx.putImageData(frame, 0, 0);
  }
  frameReq = requestAnimationFrame(render);
}
if (source) render();

$('snap').onclick = () => {
  if (!out.width) return;
  out.toBlob(b => download(b, 'photo-' + Date.now() + '.png'), 'image/png');
};

$('rec').onclick = () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  if (!out.width) return;
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const type = types.find(t => MediaRecorder.isTypeSupported(t));
  recorder = new MediaRecorder(out.captureStream(30), type ? { mimeType: type } : undefined);
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
    download(new Blob(chunks, { type: recorder.mimeType }), 'video-' + Date.now() + '.' + ext);
    $('rec').textContent = '⏺ Vidéo'; $('rec').classList.remove('rec');
  };
  recorder.start();
  $('rec').textContent = '⏹ Stop'; $('rec').classList.add('rec');
};

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// PWA
let deferred;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e; $('install').style.display = '';
});
$('install').onclick = async () => {
  if (!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null; $('install').style.display = 'none';
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

setKey(0, 255, 0);
startCam();
</script>
</body>
</html>
